# Standalone non-root static UI. CLI certificates own the first milestone.
# No service certificate or private data is available to this container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # A shared proxy certificate cannot establish a browser user's ownership.
    # Deny the entire API namespace, including alternate upload/results paths.
    location /api/ {
      default_type application/json;
      return 403 '{"error":"cli_only","message":"Use individual mTLS CLI identities; browser API access is disabled."}';
    }
    # Static UI liveness is distinct from backend/scientific readiness.
    location = /health {
      default_type application/json;
      return 200 '{"status":"ui_alive","backend_readiness":"unverified","mode":"cli_only"}';
    }
    location ^~ /api/health/ {
      default_type application/json;
      return 503 '{"status":"unverified","message":"Check backend readiness using authenticated CLI probes."}';
    }
  }
}
