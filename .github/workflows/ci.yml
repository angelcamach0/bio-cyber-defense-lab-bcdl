name: BioZero synthetic milestone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  milestone:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Unit tests and PKI acceptance
        run: |
          make test
          bash biozero/infra/PKI/test-pki.sh
      - name: Install locked ARM bioinformatics tools
        run: make bio-tools
      - name: Scientific repeat and protected end-to-end experiment
        run: |
          make science
          make experiment-soc
      - name: Preserve reviewable synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-milestone-evidence
          path: biozero/docs/evidence/*/public/
          if-no-files-found: warn
